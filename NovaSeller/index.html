<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Последнее сообщение из Discord</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2f3136; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .message-box { background: #36393f; width: 400px; border-radius: 8px; padding: 15px; border-left: 4px solid #5865F2; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .meta { font-size: 13px; color: #8e9297; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .author { font-weight: bold; color: #5865F2; }
        .text { font-size: 15px; color: #dcddde; line-height: 1.4; word-break: break-word; }
    </style>
</head>
<body>

    <div class="message-box">
        <div class="meta">
            <span id="author" class="author">Загрузка...</span>
            <span id="time"></span>
        </div>
        <div id="text" class="text">Ожидание ответа от сервера...</div>
    </div>

    <script>
        // Вставьте сюда вашу чистую ссылку на Web Service в Render
	const BACKEND_URL = 'https://novaseller.onrender.com';

        async function loadLatestMessage() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/latest-message`);
                const msg = await response.json();
                
                if (msg.error) {
                    document.getElementById('text').innerText = msg.error;
                    document.getElementById('author').innerText = 'Ошибка';
                    return;
                }

                document.getElementById('author').innerText = msg.author;
                document.getElementById('time').innerText = msg.time;
                document.getElementById('text').innerText = msg.text;
            } catch (err) {
                document.getElementById('text').innerText = 'Не удалось связаться с сервером Render';
            }
        }

        // Проверяем новые сообщения каждые 5 секунд
        setInterval(loadLatestMessage, 5000);
        loadLatestMessage();
    </script>
</body>
</html>
