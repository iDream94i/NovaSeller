<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Цены у скупщиков</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #2f3136; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .meta-info { margin-bottom: 15px; color: #8e9297; font-size: 14px; text-align: center; }
        
        /* Стилизация таблицы */
        table { border-collapse: collapse; background: #fff; color: #333; width: 100%; max-width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        th, td { padding: 12px 15px; text-align: left; border: 1px solid #e0e0e0; }
        th { background-color: #f5f5f5; font-weight: bold; color: #666; text-align: center; }
        td:first-child { font-weight: bold; color: #222; }
        td:not(:first-child) { text-align: center; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Мягкая приятная зеленая заливка фона для превысивших лимит */
        .best-price { background-color: #c8e6c9 !important; }
        
        /* Золотой цвет текста для САМОЙ высокой цены в строке */
        .highest-text { color: #bf9021 !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="meta-info">
        Автор изменения цен: <strong id="author" style="color: #fff;">-</strong> | Обновлено: <strong id="time" style="color: #fff;">-</strong>
    </div>

    <table id="prices-table">
        <thead>
            <tr>
                <th style="text-align: left;">Товар</th>
                <th>Скупщик №1</th>
                <th>Скупщик №2</th>
                <th>Скупщик №3</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td colspan="4" style="text-align:center; color:#8e9297; background: #f5f5f5;">Получение актуальных списков цен...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const BACKEND_URL = 'https://novaseller.onrender.com'; 

        // База ваших пороговых цен
        const PRICE_THRESHOLDS = {
            "Медь": 60,
            "Изумруд": 384,
            "Рубин": 799,
            "Алмаз": 4549,
            "Бензин": 219,
            "Солярка": 209,
            "Керосин": 214,
            "Фальшивые деньги": 10899,
            "Окунь": 53,
            "Карп": 399,
            "Форель": 629,
            "Лосось": 4249,
            "Жемчуг": 1649,
            "Шкура": 2239,
            "Идеальное мясо": 1679,
            "Хорошее мясо": 1099
        };

        function parsePrices(text) {
            if (!text) return [];
            const lines = text.split('\n');
            const itemsMap = {};
            let currentBuyer = 0; 

            lines.forEach(line => {
                let trimmed = line.trim().replace(/\*/g, ''); 
                if (!trimmed) return;

                if (trimmed.includes('Скупщик сырья №1')) { currentBuyer = 1; return; }
                if (trimmed.includes('Скупщик сырья №2')) { currentBuyer = 2; return; }
                if (trimmed.includes('Скупщик сырья №3')) { currentBuyer = 3; return; }

                if (trimmed.startsWith('-') && currentBuyer > 0) {
                    trimmed = trimmed.substring(1).trim(); 
                    const colonIndex = trimmed.indexOf(':');
                    if (colonIndex !== -1) {
                        const itemName = trimmed.substring(0, colonIndex).trim();
                        const priceValue = trimmed.substring(colonIndex + 1).replace(/`/g, '').trim();

                        if (!itemsMap[itemName]) {
                            itemsMap[itemName] = { name: itemName, prices: { 1: '', 2: '', 3: '' } };
                        }
                        itemsMap[itemName].prices[currentBuyer] = priceValue;
                    }
                }
            });

            return Object.values(itemsMap);
        }

        // Извлекаем цену из КРУГЛЫХ СКОБОК (для проверки зеленого фона)
        function getBracketPrice(priceStr) {
            if (!priceStr || typeof priceStr !== 'string') return -1;
            const bracketMatch = priceStr.match(/\(([^)]+)\)/);
            if (bracketMatch && bracketMatch[1]) {
                const digitsMatch = bracketMatch[1].match(/\d+/);
                return digitsMatch ? parseInt(digitsMatch[0], 10) : -1;
            }
            return -1;
        }

        // ИСПРАВЛЕНО: Извлекаем ПЕРВУЮ цену до скобок (для поиска золотого цвета текста)
        function getFirstPrice(priceStr) {
            if (!priceStr || typeof priceStr !== 'string') return -1;
            // Разделяем строку по скобке и берем строго её ПЕРВУЮ часть под индексом [0]
            const firstPartStr = priceStr.split('(')[0];
            const digitsMatch = firstPartStr.match(/\d+/);
            return digitsMatch ? parseInt(digitsMatch[0], 10) : -1;
        }

        async function loadLatestMessage() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/latest-message`);
                const msg = await response.json();
                
                if (msg.error || !msg.text) return;

                document.getElementById('author').innerText = msg.author || 'Неизвестно';
                document.getElementById('time').innerText = msg.time || '--:--:--';
                
                const items = parsePrices(msg.text);
                const tbody = document.getElementById('table-body');
                
                let tableHTML = '';
                items.forEach(item => {
                    const price1 = item.prices[1] || '';
                    const price2 = item.prices[2] || '';
                    const price3 = item.prices[3] || '';

                    // 1. ЛОГИКА ЗОЛОТОГО ЦВЕТА (Ищем самую большую базовую цену в строке)
                    const f1 = getFirstPrice(price1);
                    const f2 = getFirstPrice(price2);
                    const f3 = getFirstPrice(price3);
                    const maxFirstPrice = Math.max(f1, f2, f3);

                    const isHighestText1 = (f1 === maxFirstPrice && f1 !== -1) ? 'highest-text' : '';
                    const isHighestText2 = (f2 === maxFirstPrice && f2 !== -1) ? 'highest-text' : '';
                    const isHighestText3 = (f3 === maxFirstPrice && f3 !== -1) ? 'highest-text' : '';

                    // 2. ЛОГИКА ЗЕЛЕНОГО ФОНА (Проверяем превышение лимитов в скобках)
                    const b1 = getBracketPrice(price1);
                    const b2 = getBracketPrice(price2);
                    const b3 = getBracketPrice(price3);
                    const threshold = PRICE_THRESHOLDS[item.name] || 0;

                    const isBestBg1 = (b1 > threshold && b1 !== -1) ? 'best-price' : '';
                    const isBestBg2 = (b2 > threshold && b2 !== -1) ? 'best-price' : '';
                    const isBestBg3 = (b3 > threshold && b3 !== -1) ? 'best-price' : '';

                    tableHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td class="${isBestBg1} ${isHighestText1}">${price1 || '-'}</td>
                            <td class="${isBestBg2} ${isHighestText2}">${price2 || '-'}</td>
                            <td class="${isBestBg3} ${isHighestText3}">${price3 || '-'}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = tableHTML;

            } catch (err) {
                console.error(err);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#ed4245;">Ошибка разбора структуры данных</td></tr>`;
            }
        }

        setInterval(loadLatestMessage, 5000);
        loadLatestMessage();
    </script>
</body>
</html>
